<!DOCTYPE html>
<html data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecommerce website with HTML, Tailwind & DaisyUI</title>
    <!-- Google Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" />
    <!-- tailwind css & DaisyUI Links -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font awesome CDN link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CSS Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'rgb(14, 122, 129)',
                        secondary: 'rgb(17, 17, 17)',
                        body: 'rgb(248, 246, 243)',
                        accent: 'rgb(106, 151, 57)',
                        btn: ' rgba(14, 122, 129, 0.2)',
                    },
                    fontFamily: {
                        Poppins: 'Poppins',
                    },
                    backgroundImage: {
                        leaf1: "url('./images/leaf01.png')",
                        call_to_action: "url('./images/call.jpg')",
                        testimonials: "url('./images/testimonials.jpg')",
                    },
                },
            },
        }
    </script>
</head>

<body>
    <header>
        <!-- nav bar section start -->
        <nav class="navbar w-11/12 mx-auto py-5 px-0">
            <div class="navbar-start">
                <a class="flex items-center gap-2 text-3xl" href="#">
                    <i class="fa-solid fa-paw text-primary"></i>
                    <span class=" font-bold">Peddy</span>
                </a>
            </div>
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal px-1 flex items-center gap-5 text-lg font-medium">
                    <li class="hover:text-primary transition-colors ease-in-out duration-300">
                        <a href="#">Home</a>
                    </li>
                    <li class="hover:text-primary transition-colors ease-in-out duration-300">
                        <a href="#">Shop</a>
                    </li>
                    <li class="hover:text-primary transition-colors ease-in-out duration-300">
                        <a href="#">Contact</a>
                    </li>
                    <li class="hover:text-primary transition-colors ease-in-out duration-300">
                        <a href="#">About</a>
                    </li>
                    <li class="hover:text-primary transition-colors ease-in-out duration-300">
                        <a href="#">Contact</a>
                    </li>
                </ul>
            </div>

            <div class="navbar-end gap-5 items-center">
                <button><i class="fa-solid fa-user p-4 ring-2 ring-btn rounded-full"></i></button>
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden bg-primary text-lg">
                        <i class="fa-solid fa-bars"></i>
                    </div>
                    <ul tabindex="0"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-[1] mt-3 w-52 right-0 p-2 shadow text-lg font-medium gap-5">
                        <li class="hover:text-primary transition-colors ease-in-out duration-300">
                            <a href="#">Home</a>
                        </li>
                        <li class="hover:text-primary transition-colors ease-in-out duration-300">
                            <a href="#">Shop</a>
                        </li>
                        <li class="hover:text-primary transition-colors ease-in-out duration-300">
                            <a href="#">Contact</a>
                        </li>
                        <li class="hover:text-primary transition-colors ease-in-out duration-300">
                            <a href="#">About</a>
                        </li>
                        <li class="hover:text-primary transition-colors ease-in-out duration-300">
                            <a href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

    </header>
</body>
